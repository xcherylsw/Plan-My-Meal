<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Plan My Meals — free meal planner for Singapore households</title>
    <meta name="description" content="Meal planning, minus the mental load. Plan the week, build the shopping list, cook from what you have." />
    <meta name="theme-color" content="#4A2A1F" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Plan My Meals" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html, body, #root { min-height: 100%; margin: 0; padding: 0; background: #F7EEDF; }
      .boot { display: flex; align-items: center; justify-content: center; height: 100vh; color: #6E4328;
        font-family: -apple-system, system-ui, sans-serif; font-size: 14px; background: #F7EEDF; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot">Loading your meals…</div></div>
    <script>
      // The initial loading text is static HTML. If the app bundle fails to
      // execute, React cannot replace it; never leave visitors stuck forever.
      (function () {
        var firstError = "";
        window.addEventListener("error", function (event) {
          if (!firstError) firstError = event.message || "A script failed to load";
        }, true);
        window.addEventListener("unhandledrejection", function (event) {
          if (!firstError) firstError = String(event.reason && event.reason.message || event.reason || "App startup failed");
        });
        setTimeout(function () {
          var root = document.getElementById("root");
          if (!root || !root.querySelector(".boot")) return;
          var boot = root.querySelector(".boot");
          boot.style.cssText = "min-height:100vh;height:auto;box-sizing:border-box;padding:24px;display:flex;flex-direction:column;gap:12px;text-align:center";
          boot.textContent = "";
          var heading = document.createElement("strong");
          heading.textContent = "Today Cook What couldn't start";
          var details = document.createElement("div");
          details.textContent = firstError ? "Error: " + firstError.slice(0, 220) : "The app did not finish loading. Please send us a screenshot of this screen.";
          var hint = document.createElement("small");
          hint.textContent = "Your saved meals have not been deleted. Diagnostic: startup timeout (v20261030).";
          boot.append(heading, details, hint);
        }, 10000);
      })();
    </script>
    <script src="/ads-config.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
