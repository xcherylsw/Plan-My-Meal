<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Plan My Meals — free meal planner for Singapore households</title>
    <meta name="description" content="Meal planning, minus the mental load. Plan the week, build the shopping list, cook from what you have." />
    <meta name="theme-color" content="#4A2A1F" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Plan My Meals" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html, body, #root { min-height: 100%; margin: 0; padding: 0; background: #F7EEDF; }
      .boot { display: flex; align-items: center; justify-content: center; height: 100vh; color: #6E4328;
        font-family: -apple-system, system-ui, sans-serif; font-size: 14px; background: #F7EEDF; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot">Loading your meals…</div></div>
    <script>
      // If the JS bundle fails to load or execute, don't leave visitors on an
      // endless static loading screen. No stored recipes or plans are touched.
      (function () {
        var booted = false;
        window.addEventListener('pmm:booted', function () { booted = true; });
        function showFailure(message) {
          if (booted) return;
          var el = document.querySelector('#root .boot');
          if (!el) return;
          el.innerHTML = '';
          var panel = document.createElement('div');
          panel.style.cssText = 'max-width:320px;padding:24px;text-align:center;line-height:1.6';
          var title = document.createElement('strong');
          title.textContent = 'Meals could not load';
          var info = document.createElement('p');
          info.textContent = message;
          var retry = document.createElement('button');
          retry.textContent = 'Try again';
          retry.style.cssText = 'padding:12px 22px;border:0;border-radius:12px;background:#4A2A1F;color:white;font:inherit';
          retry.onclick = function () { location.reload(); };
          panel.append(title, info, retry);
          el.append(panel);
        }
        window.addEventListener('error', function (e) {
          if (!booted) showFailure('The app failed to start. Please try again. Your saved data has not been cleared.');
        });
        window.addEventListener('unhandledrejection', function () {
          if (!booted) showFailure('The app could not finish starting. Please try again.');
        });
        setTimeout(function () { showFailure('The app is taking too long to start. Please try again.'); }, 12000);
      })();
    </script>
    <script src="/ads-config.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
