<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Plan My Meals — free meal planner for Singapore households</title>
    <meta name="description" content="Meal planning, minus the mental load. Plan the week, build the shopping list, cook from what you have." />
    <meta name="theme-color" content="#4A2A1F" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Plan My Meals" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html, body, #root { min-height: 100%; margin: 0; padding: 0; background: #F7EEDF; }
      .boot { display: flex; align-items: center; justify-content: center; height: 100vh; color: #6E4328;
        font-family: -apple-system, system-ui, sans-serif; font-size: 14px; background: #F7EEDF; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot">Loading your meals…</div></div>
    <script>
      // The static loading message must never remain forever when the app bundle
      // fails to load or execute. No user data is deleted by this recovery UI.
      (function () {
        var timer = setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || !root.querySelector('.boot')) return;
          root.innerHTML = '<div class="boot" style="height:auto;min-height:100vh;padding:24px;box-sizing:border-box;flex-direction:column;gap:14px;text-align:center"><strong>Today Cook What couldn\\'t start.</strong><span>There may be a problem loading the app. Your saved data has not been cleared.</span><button id="retry-app" style="padding:12px 20px;border:0;border-radius:10px;background:#27564A;color:white;font-size:15px">Retry loading</button></div>';
          document.getElementById('retry-app').addEventListener('click', function () {
            var url = new URL(location.href);
            url.searchParams.set('retry', Date.now().toString());
            location.replace(url.toString());
          });
        }, 12000);
        window.addEventListener('pagehide', function () { clearTimeout(timer); });
      })();
    </script>
    <script src="/ads-config.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
